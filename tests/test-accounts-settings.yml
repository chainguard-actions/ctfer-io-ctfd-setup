name: Test accounts settings inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          url: 'http://localhost:9999'
          accounts_domain_whitelist: 'example.com:test.com'
          accounts_domain_blacklist: 'spam.com:evil.com'
          accounts_password_min_length: '8'
          accounts_num_teams: '50'
          accounts_num_users: '200'
          accounts_team_disbanding: 'inactive_only'
          accounts_incorrect_submissions_per_minute: '10'
          accounts_name_changes: 'true'

      - name: Assert action failed with connection error (not config error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when CTFd is unreachable, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when CTFd URL is unreachable (accounts settings accepted)"
