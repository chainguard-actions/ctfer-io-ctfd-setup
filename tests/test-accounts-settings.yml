name: Test accounts settings inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with accounts settings (expect failure - no CTFd running)
        id: action
        uses: .
        with:
          url: 'http://localhost:9999'
          accounts_domain_whitelist: 'example.com:test.org'
          accounts_domain_blacklist: 'spam.com:evil.org'
          accounts_incorrect_submissions_per_minute: '10'
          accounts_name_changes: 'true'
          accounts_num_users: '500'
          accounts_password_min_length: '8'
          accounts_team_disbanding: 'inactive_only'
          accounts_verify_emails: 'true'
        continue-on-error: true
      - name: Assert action failed due to no CTFd instance
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when CTFd URL is unreachable, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when CTFd URL is unreachable with accounts settings"
