name: Test full input coverage (all remaining inputs)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          url: http://127.0.0.1:19999
          api_key: 'fake-api-key-for-coverage'
          dir: '.'
          # Appearance
          appearance_name: 'Full Coverage CTF'
          appearance_description: 'Testing all inputs'
          # Theme
          theme_logo: ''
          theme_small_icon: ''
          theme_name: 'core'
          theme_color: '#ff0000'
          theme_header: ''
          theme_footer: ''
          theme_settings: ''
          # Accounts
          accounts_domain_whitelist: 'example.com:test.com'
          accounts_domain_blacklist: 'spam.com:evil.com'
          accounts_verify_emails: 'false'
          accounts_team_creation: 'true'
          accounts_team_size: '5'
          accounts_password_min_length: '8'
          accounts_num_teams: '100'
          accounts_num_users: '500'
          accounts_team_disbanding: 'inactive_only'
          accounts_incorrect_submissions_per_minute: '10'
          accounts_name_changes: 'true'
          # Challenges
          challenges_view_self_submissions: 'true'
          challenges_max_attempts_behavior: 'lockout'
          challenges_max_attempts_timeout: '300'
          challenges_hints_free_public_access: 'false'
          challenges_challenge_ratings: 'public'
          # Pages
          pages_robots_txt: 'User-agent: *\nDisallow: /'
          # MajorLeagueCyber
          major_league_cyber_client_id: 'fake-mlc-client-id'
          major_league_cyber_client_secret: 'fake-mlc-client-secret'
          # Settings
          settings_challenge_visibility: 'public'
          settings_account_visibility: 'public'
          settings_score_visibility: 'public'
          settings_registration_visibility: 'public'
          settings_paused: 'false'
          # Security
          security_html_sanitization: 'true'
          security_registration_code: 'secret-reg-code'
          # Email
          email_registration_subject: 'Welcome to the CTF'
          email_registration_body: 'Thank you for registering.'
          email_confirmation_subject: 'Confirm your email'
          email_confirmation_body: 'Please confirm your email address.'
          email_new_account_subject: 'New account created'
          email_new_account_body: 'A new account has been created.'
          email_password_reset_subject: 'Password reset'
          email_password_reset_body: 'Click here to reset your password.'
          email_password_reset_confirmation_subject: 'Password reset confirmed'
          email_password_reset_confirmation_body: 'Your password has been reset.'
          email_from: 'noreply@example.com'
          email_server: 'smtp.example.com'
          email_port: '587'
          email_username: 'smtp-user'
          email_password: 'smtp-password'
          email_tls_ssl: 'false'
          email_starttls: 'true'
          # Time
          time_start: '2024-01-01T00:00:00Z'
          time_end: '2024-12-31T23:59:59Z'
          time_freeze: '2024-12-31T12:00:00Z'
          time_view_after: 'true'
          # Social
          social_shares: 'true'
          social_template: ''
          # Legal
          legal_tos_url: 'https://example.com/tos'
          legal_tos_content: 'Terms of service content.'
          legal_privacy_policy_url: 'https://example.com/privacy'
          legal_privacy_policy_content: 'Privacy policy content.'
          # Mode
          mode: 'users'
          # Admin
          admin_name: 'admin'
          admin_email: 'admin@example.com'
          admin_password: 'adminpassword'

      - name: Assert action failed at network level (not config validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action MUST fail because the URL is unreachable (no CTFd running).
          # This verifies the action accepted all inputs and only failed at the
          # network connection stage, not at input/config validation.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with unreachable URL, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly processed all inputs and failed at network level"
