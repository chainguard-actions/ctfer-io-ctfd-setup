name: Test inline inputs configuration fails at connection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          url: http://localhost:9999
          appearance_name: MyCTF
          appearance_description: My CTF description
          admin_name: admin
          admin_email: admin@example.com
          admin_password: securepassword
          mode: users
          settings_challenge_visibility: public
          settings_account_visibility: public
          settings_score_visibility: public
          settings_registration_visibility: public
          accounts_verify_emails: 'false'
          theme_name: core

      - name: Assert action failed at connection not input validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when CTFd is unreachable, got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when CTFd URL is unreachable (all inline inputs were accepted)"
