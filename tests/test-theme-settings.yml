name: Test theme settings inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create theme asset files
        run: |
          echo 'placeholder-logo' > /tmp/logo.png
          echo 'placeholder-icon' > /tmp/icon.png
          echo '<header>CTF Header</header>' > /tmp/header.html
          echo '<footer>CTF Footer</footer>' > /tmp/footer.html
          echo '{"key":"value"}' > /tmp/theme-settings.json

      - id: action
        uses: .
        continue-on-error: true
        with:
          url: 'http://localhost:9999'
          theme_logo: '/tmp/logo.png'
          theme_small_icon: '/tmp/icon.png'
          theme_color: '#ff0000'
          theme_header: '/tmp/header.html'
          theme_footer: '/tmp/footer.html'
          theme_settings: '/tmp/theme-settings.json'

      - name: Assert action failed with connection error (not config error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when CTFd is unreachable, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when CTFd URL is unreachable (theme settings accepted)"
