name: Test theme settings inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with theme settings (expect failure - no CTFd running)
        id: action
        uses: .
        with:
          url: 'http://localhost:9999'
          theme_color: '#ff0000'
          theme_footer: '/path/to/footer.html'
          theme_header: '/path/to/header.html'
          theme_logo: '/path/to/logo.png'
          theme_settings: '/path/to/settings.json'
          theme_small_icon: '/path/to/icon.png'
          theme_name: 'core'
        continue-on-error: true
      - name: Assert action failed due to no CTFd instance
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when CTFd URL is unreachable, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when CTFd URL is unreachable with theme settings"
