name: Test teams mode with unreachable URL
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          url: http://127.0.0.1:19999
          appearance_name: 'Team CTF'
          appearance_description: 'A team-based CTF for CI testing'
          admin_name: 'admin'
          admin_email: 'admin@example.com'
          admin_password: 'adminpassword'
          mode: 'teams'
          accounts_team_creation: 'true'
          accounts_team_size: '4'
          settings_challenge_visibility: 'private'
          settings_account_visibility: 'public'
          settings_score_visibility: 'public'
          settings_registration_visibility: 'public'

      - name: Assert action failed with connection error (not config validation error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action MUST fail because the URL is unreachable (no CTFd running).
          # This verifies the action started, processed teams-mode inputs, validated
          # config successfully, and only failed at the network connection stage.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with unreachable URL, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly processed teams mode config and failed at network level"
