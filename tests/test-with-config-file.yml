name: Test with config file fails at connection not config parsing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          url: http://localhost:9999
          file: ${{ github.workspace }}/pristine/ctfer-io--ctfd-setup/v1.8.5/tests/fixtures/minimal.ctfd.yaml

      - name: Assert action failed at connection not config parsing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when CTFd is unreachable, got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when CTFd URL is unreachable (config file was parsed successfully)"
