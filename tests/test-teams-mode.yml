name: Test teams mode configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with teams mode (expect failure - no CTFd running)
        id: action
        uses: .
        with:
          url: 'http://localhost:9999'
          mode: 'teams'
          appearance_name: 'Team CTF'
          appearance_description: 'A team-based CTF'
          accounts_team_creation: 'true'
          accounts_team_size: '4'
          accounts_num_teams: '100'
          settings_challenge_visibility: 'private'
          settings_account_visibility: 'private'
          settings_score_visibility: 'private'
          settings_registration_visibility: 'private'
          admin_name: 'admin'
          admin_email: 'admin@example.com'
          admin_password: 'securepassword'
        continue-on-error: true
      - name: Assert action failed due to no CTFd instance
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when CTFd URL is unreachable, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when CTFd URL is unreachable in teams mode"
