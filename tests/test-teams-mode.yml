name: Test teams mode configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          url: 'http://localhost:9999'
          appearance_name: 'TeamsCTF'
          appearance_description: 'A teams-based CTF'
          admin_name: 'admin'
          admin_email: 'admin@example.com'
          admin_password: 'password123'
          mode: 'teams'
          accounts_team_size: '5'
          accounts_team_creation: 'true'
          settings_challenge_visibility: 'private'
          settings_account_visibility: 'private'
          settings_score_visibility: 'private'
          settings_registration_visibility: 'private'

      - name: Assert action failed with connection error (not config error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when CTFd is unreachable, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when CTFd URL is unreachable (teams mode config accepted)"
