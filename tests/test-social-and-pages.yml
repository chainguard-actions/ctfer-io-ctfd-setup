name: Test social and pages inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create social template file
        run: |
          echo "I just solved {challenge} on {ctf}!" > /tmp/social-template.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          url: 'http://localhost:9999'
          social_shares: 'true'
          social_template: '/tmp/social-template.txt'
          pages_robots_txt: "User-agent: *\nDisallow: /"

      - name: Assert action failed with connection error (not config error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when CTFd is unreachable, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when CTFd URL is unreachable (social and pages settings accepted)"
