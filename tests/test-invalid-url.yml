name: Test invalid URL error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          url: 'not-a-valid-url'
          api_key: 'dummy-api-key'
      - name: Assert action failed due to invalid URL
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when URL is invalid, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when URL was invalid"
