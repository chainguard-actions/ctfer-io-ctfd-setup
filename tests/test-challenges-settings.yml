name: Test challenges settings inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with challenges settings (expect failure - no CTFd running)
        id: action
        uses: .
        with:
          url: 'http://localhost:9999'
          challenges_hints_free_public_access: 'true'
          challenges_max_attempts_timeout: '300'
          challenges_view_self_submissions: 'true'
          challenges_max_attempts_behavior: 'lockout'
          challenges_challenge_ratings: 'public'
        continue-on-error: true
      - name: Assert action failed due to no CTFd instance
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when CTFd URL is unreachable, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when CTFd URL is unreachable with challenges settings"
