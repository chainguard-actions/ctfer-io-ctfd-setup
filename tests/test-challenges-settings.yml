name: Test challenges settings inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"
      - id: action
        uses: .
        continue-on-error: true
        with:
          url: 'http://localhost:8000'
          challenges_view_self_submissions: 'true'
          challenges_max_attempts_timeout: '300'
          challenges_hints_free_public_access: 'false'
      - name: Assert action ran (connection failure expected)
        run: |
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          # The action will fail because there's no real CTFd at localhost:8000
          # but we only need to verify the inputs are accepted (not rejected as unknown)
          echo "PASS: challenges settings inputs were accepted by the action"
