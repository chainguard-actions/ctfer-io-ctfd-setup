name: Test invalid mode enum value (config validation failure)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          url: 'http://127.0.0.1:19999'
          appearance_name: 'TestCTF'
          appearance_description: 'A test CTF'
          admin_name: 'admin'
          admin_email: 'admin@example.com'
          admin_password: 'adminpassword'
          mode: 'invalid_mode'

      - name: Assert action failed (invalid mode enum value)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because 'invalid_mode' is not a valid enum value
          # for mode (must be 'users' or 'teams'). Config validation should catch this.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to invalid mode enum value"
            exit 1
          fi
          echo "PASS: action failed as expected (invalid mode enum value rejected)"
