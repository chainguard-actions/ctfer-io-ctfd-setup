name: Test minimal inputs (url only)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          url: 'http://127.0.0.1:8888'
      - name: Assert action failed gracefully with minimal inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when CTFd is not running, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when no CTFd instance is available"
