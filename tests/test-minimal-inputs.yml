name: Test minimal required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with only required url input (expect failure - no CTFd running)
        id: action
        uses: .
        with:
          url: 'http://127.0.0.1:8000'
        continue-on-error: true
      - name: Assert action attempted connection and failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no CTFd instance is running, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when no CTFd instance is available"
