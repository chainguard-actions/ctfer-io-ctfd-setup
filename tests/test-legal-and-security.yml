name: Test legal and security inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          url: 'http://localhost:9999'
          legal_tos_url: 'https://example.com/tos'
          legal_tos_content: 'These are the terms of service.'
          legal_privacy_policy_url: 'https://example.com/privacy'
          legal_privacy_policy_content: 'This is the privacy policy.'
          security_html_sanitization: 'true'
          security_registration_code: 'secret-reg-code-2024'

      - name: Assert action failed with connection error (not config error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when CTFd is unreachable, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when CTFd URL is unreachable (legal and security settings accepted)"
