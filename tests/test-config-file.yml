name: Test config file input is parsed before connection attempt
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create CTFd config file
        run: |
          cat > /tmp/ctfd-config.yaml << 'EOF'
          appearance:
            name: 'TestCTF 2024'
            description: 'A test CTF for CI'

          admin:
            name: 'admin'
            email: 'admin@example.com'
            password: 'securepassword'
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          url: 'http://localhost:9999'
          file: '/tmp/ctfd-config.yaml'

      - name: Assert action failed (connection error, not config parse error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when CTFd is unreachable, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when CTFd URL is unreachable (config file was parsed)"
