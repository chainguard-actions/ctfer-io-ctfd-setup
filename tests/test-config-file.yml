name: Test config file loading (file input, unreachable URL)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          # Docker mounts GITHUB_WORKSPACE at /github/workspace inside the container.
          # The fixture file is committed and available at this path inside the container.
          file: '/github/workspace/tests/fixtures/ctfd-config.yaml'
          url: 'http://127.0.0.1:19999'

      - name: Assert action failed with connection error (not file/config parse error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the URL is unreachable,
          # but it should NOT fail due to config file parsing errors.
          # We expect 'failure' here since CTFd is not running.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no CTFd at 127.0.0.1:19999)"
            exit 1
          fi
          echo "PASS: action failed as expected (connection refused, not config file error)"
