name: Test config file usage
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          url: http://127.0.0.1:19999
          file: /github/workspace/tests/fixtures/ctfd-config/.ctfd.yaml

      - name: Assert action failed with connection error (not config parsing error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action MUST fail because the URL is unreachable (no CTFd running).
          # This verifies the action started, read the config file, parsed it
          # successfully, and only failed at the network connection stage.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with unreachable URL, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly read config file and failed at network level"
